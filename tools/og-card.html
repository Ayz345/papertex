<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The link-preview picture (1200×630), rendered to img/og-card.png by
     tools/make-og.js. The home page's opening, composed for this size:
     near-black, the block of type with its grey panel and yellow bracket,
     and one sheet with an equation and the LaTeX behind it. -->
<link rel="stylesheet" href="../css/fonts.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #111; color: #f3efe6; font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif; position: relative; }
  /* the document, far off and out of focus */
  .far { position: absolute; background: #e4ded0; filter: blur(10px) brightness(.24); transform: rotate(-4deg); }
  .far.a { left: -60px; top: 70px; width: 470px; height: 560px; }
  .far.b { left: 700px; top: -120px; width: 520px; height: 420px; }
  .shade { position: absolute; inset: 0; background: radial-gradient(90% 80% at 50% 50%, transparent 30%, rgba(0, 0, 0, .7) 100%); }
  .tick { position: absolute; color: rgba(243, 239, 230, .32); font-weight: 300; font-size: 17px; }
  .brand { position: absolute; left: 34px; top: 50%; transform: translateY(-50%) rotate(180deg); writing-mode: vertical-rl; font: 700 26px "PaperTeX", Georgia, serif; color: #f2c230; }

  .lead { position: absolute; left: 112px; top: 150px; width: 560px; }
  .slab { position: absolute; left: 268px; top: -62px; width: 250px; height: 446px; background: rgba(40, 40, 40, .8); }
  .brk { position: absolute; left: 336px; top: -76px; width: 196px; height: 96px; border: 0 solid #f2c230; border-width: 14px 14px 0 0; }
  h1 { position: relative; margin: 0; font-size: 82px; line-height: .98; letter-spacing: -.05em; font-weight: 700; white-space: nowrap; }
  h1::before { content: ""; display: inline-block; width: 78px; height: 8px; background: #f2c230; margin-right: 10px; vertical-align: .3em; }
  h1 i { font-style: normal; color: #f2c230; }
  p { position: relative; margin: 30px 0 0 150px; font-size: 21px; line-height: 1.4; width: 330px; }
  p b { color: #f2c230; }

  .sheet { position: absolute; left: 742px; top: 96px; width: 390px; height: 438px; background: #e4ded0; color: #191a1c; padding: 44px 38px;
    font: 19px/1.45 "PaperTeX", Georgia, serif; box-shadow: 0 40px 80px -26px #000, inset 0 0 80px rgba(60, 45, 20, .16); }
  .sheet h2 { margin: 0 0 10px; font-size: 23px; font-weight: 700; }
  .sheet .t { margin: 0; text-align: justify; }
  .eqn { text-align: center; font-size: 36px; margin: 22px 0 0; }
  .eqn sub, .eqn sup { font-size: .6em; line-height: 0; }
  .eqn sub { vertical-align: -.5em; } .eqn sup { vertical-align: .8em; }
  .eqn span { border-top: 2px solid; }
  .hot { position: absolute; left: 196px; top: 210px; width: 34px; height: 34px; border-radius: 50%; border: 2px dotted #9a7400; background: rgba(242, 194, 48, .3); }
  .hot::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: #a87f00; }
  .code { position: absolute; left: -70px; top: 270px; width: 484px; background: #1b1b1b; color: #e9e5db; border-top: 6px solid #f2c230; padding: 16px 18px; white-space: pre;
    font: 14.5px/1.7 "Cascadia Mono", Consolas, monospace; box-shadow: 0 24px 50px -18px #000; }
  .code b { color: #f2c230; font-weight: 400; }
</style>
</head>
<body>
<div class="far a"></div><div class="far b"></div><div class="shade"></div>
<span class="tick" style="left:300px;top:14px">+</span><span class="tick" style="left:900px;top:14px">+</span>
<span class="tick" style="left:300px;bottom:14px">+</span><span class="tick" style="left:900px;bottom:14px">+</span>
<span class="tick" style="right:22px;top:160px">+</span><span class="tick" style="right:22px;bottom:160px">+</span>
<span class="brand">PaperTeX</span>

<div class="lead">
  <span class="slab"></span><span class="brk"></span>
  <h1>Write the<br>paper, not<br>the code <i>/</i></h1>
  <p><b>PAPERTEX</b> is a LaTeX editor with no LaTeX in it. Free, in your browser.</p>
</div>

<div class="sheet">
  <h2>1&ensp;Introduction</h2>
  <div class="t">The integral of a Gaussian has a closed form,</div>
  <div class="eqn">∫<sub>−∞</sub><sup>∞</sup> <i>e</i><sup>−<i>x</i>²</sup> <i>dx</i> = √<span>π</span></div>
  <span class="hot"></span>
  <div class="code"><b>\begin</b>{equation}
  <b>\int</b>_{-<b>\infty</b>}^{<b>\infty</b>} e^{-x^{2}}\,dx = <b>\sqrt</b>{<b>\pi</b>}
<b>\end</b>{equation}</div>
</div>
</body>
</html>
