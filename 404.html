<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Shown for any address that does not exist, at that address — so every
     link here starts at the site root (tools/build-web.js adds the site's
     path when it is not served at the root). No scripts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Page not found · PaperTeX</title>
<link rel="icon" href="/desktop/papertex.png">
<style>
  :root { --ink: #23262b; --ink-2: #4b5058; --muted: #5f646d; --paper: #fffefb; --desk: #e4e2de; --accent: #9a5b06; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--desk); color: var(--ink); display: grid; place-items: center; padding: 16px;
    font: 16px/1.65 Georgia, "Times New Roman", serif;
  }
  .sheet {
    width: 100%; max-width: 560px; background: var(--paper); padding: 44px 48px 48px; border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(30, 28, 24, .06), 0 18px 48px -16px rgba(30, 28, 24, .28);
  }
  @media (max-width: 600px) { .sheet { padding: 28px 22px 32px; } }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 700 20px Georgia, serif; }
  .brand img { width: 30px; height: 30px; transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
  .brand:hover img { transform: rotate(-8deg) scale(1.06); }
  h1 { font-size: 30px; font-weight: 400; margin: 28px 0 6px; letter-spacing: -.01em; }
  .err { font: 15px/1.5 Consolas, "Cascadia Mono", monospace; color: #8a2a12; background: #fbeee9; border-left: 3px solid #c2410c; padding: 8px 12px; margin: 14px 0 18px; }
  p { color: var(--ink-2); margin: 0 0 22px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 8px; text-decoration: none;
    font: 600 14px system-ui, "Segoe UI", sans-serif;
    transition: transform .18s cubic-bezier(.2,.7,.2,1), background-color .2s ease, box-shadow .25s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .solid { background: #7a4f10; color: #fff9ee; }
  .solid:hover { background: #5c3a0a; box-shadow: 0 12px 22px -12px rgba(92, 58, 10, .9); }
  .ghost { color: #7a4f10; box-shadow: inset 0 0 0 1px #e2c99c; }
  .ghost:hover { background: #fdf3dd; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .001ms !important; } }
</style>
</head>
<body>
<main class="sheet">
  <a class="brand" href="/"><img src="/desktop/papertex.png" alt="" width="30" height="30"><span>PaperTeX</span></a>
  <h1>This page does not exist</h1>
  <div class="err">! LaTeX Error: File not found.</div>
  <p>The address may be mistyped, or the page has moved. Your documents are safe: they are kept in your browser, not at an address.</p>
  <div class="row">
    <a class="btn solid" href="/app.html">Open the editor</a>
    <a class="btn ghost" href="/">Home page</a>
    <a class="btn ghost" href="/about.html">About</a>
  </div>
</main>
</body>
</html>
